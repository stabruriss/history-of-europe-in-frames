<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简明欧洲史图册</title>
<style>/*__LEAFLET_CSS__*/</style>
<style>
:root{
  --paper:#f3ead6; --paper2:#eadcbf; --paper3:#e2d1ad;
  --ink:#2a2018; --ink2:#5a4836; --ink3:#8a7458;
  --rule:#cdb68c; --accent:#8a2a1d;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --latin:"Hoefler Text","Baskerville","Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --kai:"Kaiti SC","STKaiti","Kai","KaiTi","Songti SC",serif;
  --side:432px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{display:flex;overflow:hidden}

/* ---------- sidebar ---------- */
#side{width:var(--side);flex:none;height:100%;display:flex;flex-direction:column;position:relative;z-index:2;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    linear-gradient(180deg,#f6eedd 0%,var(--paper) 40%,#efe3c9 100%);
  border-right:1px solid var(--rule);box-shadow:6px 0 18px -10px rgba(60,40,10,.35)}
#side header{padding:22px 26px 12px;border-bottom:1px solid var(--rule)}
.kicker{font-family:var(--latin);font-size:11px;letter-spacing:.42em;color:var(--accent);text-transform:uppercase}
h1{margin:6px 0 0;font-size:25px;line-height:1.25;font-weight:900;letter-spacing:.06em}
h1 span{display:block;font-size:13px;font-weight:400;letter-spacing:.3em;color:var(--ink2);margin-top:4px}

#mobileToc{display:none}
#toc{padding:10px 20px 12px;border-bottom:1px solid var(--rule);display:grid;gap:5px;max-height:320px;overflow:auto;flex:none}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ch>b{font-size:10px;color:var(--ink3);letter-spacing:.1em;font-weight:400;width:68px;flex:none;text-align:right;padding-right:4px;white-space:nowrap}
.ch .chips{display:flex;flex-wrap:wrap;gap:2px;flex:1}
.chip{font:inherit;font-size:13px;line-height:1;padding:5px 6px 5px;border:1px solid transparent;border-radius:2px;background:none;color:var(--ink);cursor:pointer;position:relative;transition:background .15s,border-color .15s}
.chip:hover{background:rgba(138,42,29,.07);border-color:var(--rule)}
.chip i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px;background:var(--c,#999);opacity:.85}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on i{box-shadow:0 0 0 1.5px var(--paper)}

#card{flex:1;overflow-y:auto;padding:18px 28px 28px;scroll-behavior:smooth}
#card::-webkit-scrollbar{width:8px}#card::-webkit-scrollbar-thumb{background:var(--paper3);border-radius:4px}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--ink3)}
.eyebrow em{font-style:normal;font-family:var(--latin);color:var(--accent);letter-spacing:.1em;margin-right:8px}
h2{font-size:31px;margin:6px 0 2px;font-weight:900;letter-spacing:.05em;line-height:1.2}
h2::after{content:"";display:block;width:44px;height:3px;margin-top:10px;background:var(--c,var(--accent))}
.en-name{font-family:var(--latin);font-size:18px;line-height:1.3;color:var(--ink2);margin:8px 0 0}
.orig{font-family:var(--latin);font-style:italic;color:var(--ink3);font-size:13px;margin:5px 0 13px;line-height:1.5}
.caution{margin:12px 0;padding:11px 13px;border-left:3px solid #a67a31;background:rgba(166,122,49,.1);font-size:13px;line-height:1.75;color:var(--ink2)}
.map-jump{font:inherit;font-size:12.5px;line-height:1.5;padding:8px 10px;margin:6px 0;border:1px solid var(--rule);background:rgba(234,220,191,.45);color:var(--accent);cursor:pointer;text-align:left}
.map-jump[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lede{font-size:16px;line-height:1.85;margin:0 0 14px;color:var(--ink)}
#card ul{margin:0;padding:0;list-style:none}
#card li{font-size:14.5px;line-height:1.85;margin:0 0 9px;padding-left:16px;position:relative;color:#3a2e22}
#card ul>li::before{content:"";position:absolute;left:2px;top:.82em;width:5px;height:5px;transform:rotate(45deg);background:var(--c,var(--accent));opacity:.75}
#card b{font-weight:700;color:var(--ink)}
.lao{margin:18px 0 6px;padding:12px 14px 12px 54px;position:relative;font-family:var(--kai);font-size:15.5px;line-height:1.8;color:#4a3420;background:rgba(138,42,29,.06);border-left:2px solid var(--accent)}
.lao::before{content:"老夫曰";position:absolute;left:10px;top:12px;width:32px;font-family:var(--serif);font-size:11px;line-height:1.25;letter-spacing:.05em;color:#fff;background:var(--accent);padding:4px 3px;text-align:center;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.see{margin-top:16px;font-size:13px;color:var(--ink3)}
.see a,.go{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent);margin-right:10px}
.hint{font-size:12.5px;color:var(--ink3);margin:10px 0 6px;letter-spacing:.05em}
ol.tl{list-style:none;margin:6px 0 0;padding:0;counter-reset:none}
ol.tl li{padding:5px 8px 5px 34px !important;margin:0 !important;border-bottom:1px dotted var(--rule);cursor:pointer;font-size:13.5px !important;line-height:1.55 !important;position:relative}
ol.tl li:hover{background:rgba(178,34,34,.07)}
ol.tl li .n{position:absolute;left:4px;top:6px;width:20px;height:20px;border-radius:50%;background:#b22222;color:#fff;font-size:11px;line-height:20px;text-align:center;font-family:var(--latin)}
ol.tl li .n.b{background:#2a2018}
ol.tl li em{font-style:normal;color:var(--ink3);font-size:12px;margin-right:6px;font-family:var(--latin)}
ol.tl li.on{background:rgba(178,34,34,.12)}

#side footer{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-top:1px solid var(--rule);font-size:13px;background:rgba(234,220,191,.5)}
#side footer button{font:inherit;background:none;border:1px solid var(--rule);padding:6px 12px;cursor:pointer;color:var(--ink);border-radius:2px}
#side footer button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#side footer button:disabled{opacity:.35;pointer-events:none}
#pos{font-family:var(--latin);color:var(--ink3);letter-spacing:.1em}

/* ---------- map ---------- */
#mapwrap{flex:1;position:relative;height:100%}
#map{position:absolute;inset:0;background:#a8bcc3}
#mapnote{position:absolute;top:56px;right:12px;left:12px;z-index:800;padding:8px 12px;background:rgba(243,234,214,.96);border:1px solid var(--rule);color:var(--ink2);font-size:12px;line-height:1.6}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.lb.hidden{display:none !important}
.leaflet-container{font-family:var(--serif)}
/* filter per tile, not on the pane: a pane-level filter shows white seams at fractional zoom */
.leaflet-tile{filter:sepia(.32) saturate(.78) contrast(.97) brightness(1.04)}
#map::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:300;
  box-shadow:inset 0 0 120px rgba(80,55,20,.28), inset 0 0 22px rgba(80,55,20,.18)}
.leaflet-control-attribution{background:rgba(243,234,214,.8) !important;font-size:10px;color:var(--ink2)}
.leaflet-control-attribution a{color:var(--ink2)}
.leaflet-bar a{background:var(--paper);color:var(--ink);border-color:var(--rule)}
.leaflet-bar a:hover{background:var(--paper2)}
.leaflet-control-scale-line{background:rgba(243,234,214,.75);border-color:var(--ink2);color:var(--ink2);font-family:var(--latin)}

#tools{position:absolute;top:12px;right:12px;z-index:800;display:flex;gap:6px}
#tools button{font:inherit;font-size:13px;padding:7px 11px;background:rgba(243,234,214,.94);border:1px solid var(--rule);color:var(--ink);cursor:pointer;border-radius:2px;box-shadow:0 1px 4px rgba(60,40,10,.18)}
#tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#tools button:hover{border-color:var(--ink2)}

#legend{position:absolute;left:14px;bottom:30px;z-index:800;background:rgba(243,234,214,.94);border:1px solid var(--rule);padding:9px 12px 8px;font-size:12.5px;line-height:1.5;max-width:300px;box-shadow:0 1px 6px rgba(60,40,10,.18)}
#legend:empty{display:none}
#legend div{display:flex;align-items:center;gap:8px;margin:2px 0}
#legend s{flex:none;width:22px;height:12px;display:inline-block;text-decoration:none}
#legend s.fill{background:var(--c);opacity:.55;border:1.5px solid var(--c)}
#legend s.dash{border:2px dashed var(--c);height:10px;background:transparent}
#legend s.line{height:0;border-top:3px solid var(--c)}
#legend s.dline{height:0;border-top:2.5px dashed var(--c)}
#legend s.dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin:0 6px}
#legend s.seal{width:14px;height:14px;background:#a3271b;color:#fff;font-size:9px;line-height:14px;text-align:center;margin:0 4px;border-radius:1px}
#legend .note{color:var(--ink3);font-size:11px;margin-top:5px;border-top:1px dotted var(--rule);padding-top:4px}

/* labels */
.lb{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);pointer-events:none;line-height:1;
  text-shadow:0 0 3px rgba(243,234,214,.95),0 0 6px rgba(243,234,214,.85),0 0 1px #f3ead6}
.lb.sea{color:#3e6b78;font-size:13px;letter-spacing:.55em;font-style:italic;opacity:.92;text-shadow:0 0 4px rgba(225,235,235,.9)}
.lb.sea.big{font-size:17px;letter-spacing:.9em}
.lb.mtn{color:#6d4b2a;font-size:12px;letter-spacing:.35em}
.lb.desert{color:#8a6a3c;font-size:12.5px;letter-spacing:.5em}
.lb.island{color:#655235;font-size:12px;letter-spacing:.08em;font-weight:700;line-height:1.05}
.lb.island.archipelago{font-weight:400;font-style:italic;letter-spacing:.15em}
.leaflet-container.z8 .archipelago{display:none}
.leaflet-container.maritime-off .maritime{display:none !important}
.lb.sea.maritime{color:#234f5d;font-weight:600;text-shadow:0 0 3px rgba(243,234,214,.95),0 0 5px rgba(243,234,214,.85)}
.leaflet-container:not(.z5) .lb.maritime:not(.big){font-size:11px;letter-spacing:.08em}
.leaflet-container:not(.z5) .lb.maritime:not(.big) .lb-en{font-size:9px}
.leaflet-container:not(.z4) .lb.maritime:not(.big) .lb-en{display:none}
.lb.river{color:#235f93;font-size:11.5px;letter-spacing:.12em}
.lb.people{color:#5a4836;font-size:12.5px;letter-spacing:.35em;font-style:italic}
.lb.region{font-size:19px;font-weight:900;letter-spacing:.25em;color:var(--c,#333);text-shadow:0 0 4px rgba(243,234,214,1),0 0 8px rgba(243,234,214,.95),0 0 14px rgba(243,234,214,.7)}
.lb.region.sm{font-size:14px;letter-spacing:.15em}
.lb.region small{display:block;font-size:11px;font-weight:400;letter-spacing:.1em;margin-top:4px;color:var(--ink2);text-align:center}
.lb.note{color:var(--ink2);font-size:11.5px;letter-spacing:.05em}
.lb.country{color:#5d5d5d;font-size:11px;letter-spacing:.2em;opacity:.85}
.lb.v{writing-mode:vertical-rl;letter-spacing:.35em}
.lb.click{pointer-events:auto;cursor:pointer}
.lb.click:hover{text-decoration:underline;text-underline-offset:4px}
.leaflet-container:not(.z3) .mz3,.leaflet-container:not(.z4) .mz4,.leaflet-container:not(.z5) .mz5,
.leaflet-container:not(.z6) .mz6,.leaflet-container:not(.z7) .mz7,.leaflet-container:not(.z8) .mz8{display:none}
.lb.force{display:block !important}
.lb .lb-en{display:block;font-family:var(--latin);font-weight:400;font-size:10px;letter-spacing:.025em;line-height:1.15;text-align:center;margin-top:3px;font-style:italic}
.lb.region .lb-en{font-size:11px}
.lb.v .lb-en{writing-mode:vertical-rl;text-orientation:mixed}
.pin .pin-en{display:block;font-family:var(--latin);font-size:10px;letter-spacing:0;line-height:1.1;color:var(--ink2);font-weight:400;margin-top:2px}
.parch .popup-en{font-family:var(--latin);font-size:13px;color:var(--accent);display:block;margin-bottom:4px}

/* pins: --h = half the marker width, so the marker centre sits on the coordinate */
.pin{--h:5px;position:absolute;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;line-height:1;transform:translate(calc(-1 * var(--h)),-50%)}
.pin.left{flex-direction:row-reverse;transform:translate(calc(-100% + var(--h)),-50%)}
.pin i{flex:none;display:block;width:10px;height:10px;border-radius:50%;background:var(--c,#2a2018);border:2px solid #f6eedd;box-shadow:0 0 0 1px rgba(42,32,24,.55);font-style:normal}
.pin span{font-size:12.5px;color:var(--ink);font-weight:700;letter-spacing:.04em;
  text-shadow:0 0 3px #f3ead6,0 0 5px #f3ead6,0 0 8px rgba(243,234,214,.9)}
.pin.k-modern{--h:4px}.pin.k-modern i{background:#f6eedd;border:none;box-shadow:0 0 0 1.5px #6b6b6b;width:8px;height:8px}
.pin.k-modern span{font-weight:400;color:#555;font-style:italic}
.pin.k-site{--h:4.5px}.pin.k-site i{border-radius:1px;transform:rotate(45deg);width:9px;height:9px}
.pin.k-peak{--h:6px}.pin.k-peak i{border-radius:0;background:transparent;border:none;box-shadow:none;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #6d4b2a}
.pin.k-battle{--h:6px}.pin.k-battle i{background:transparent;border:none;box-shadow:none;position:relative;width:12px;height:12px}
.pin.k-battle i::before,.pin.k-battle i::after{content:"";position:absolute;left:-1px;top:4.5px;width:14px;height:3px;background:#a3271b;border-radius:1px;box-shadow:0 0 0 1px #f6eedd}
.pin.k-battle i::before{transform:rotate(45deg)}.pin.k-battle i::after{transform:rotate(-45deg)}
.pin.k-colony{--h:4px}.pin.k-colony i{width:8px;height:8px;border-width:1.5px;background:#2a5aa0}
.pin.k-colony span{font-weight:400;font-size:12px}
.pin.k-lao{--h:7.5px}.pin.k-lao i{width:15px;height:15px;border-radius:2px;background:#a3271b;border:none;box-shadow:0 0 0 1.5px #f6eedd,0 0 0 2.5px rgba(163,39,27,.5);position:relative}
.pin.k-lao i::after{content:"老";position:absolute;inset:0;color:#fff;font-size:10px;line-height:15px;text-align:center;font-family:var(--serif)}
.pin.k-lao span{color:#8a2a1d}
.pin.k-num{--h:9px}.pin.k-num i{width:18px;height:18px;background:#b22222;border:1.5px solid #f6eedd;box-shadow:0 0 0 1px rgba(80,10,10,.6);position:relative}
.pin.k-num i::after{content:attr(data-n);position:absolute;inset:0;color:#fff;font-size:10px;line-height:15px;text-align:center;font-family:var(--latin);font-weight:700}
.pin.k-num.b i{background:#2a2018}
.pin.k-cat{--h:8px}.pin.k-cat i{width:auto;height:auto;border-radius:2px;padding:1px 3px;background:#235f93;color:#fff;font-size:10px;font-family:var(--latin);border:1px solid #f6eedd;box-shadow:none}
.pin.k-big{--h:6.5px}.pin.k-big span{font-size:15px}.pin.k-big i{width:13px;height:13px;background:#8a1c1c}
.pin.k-lake{transform:translate(-50%,-50%)}.pin.k-lake i{display:none}.pin.k-lake span{font-weight:400;color:#235f93;font-style:italic}

/* popups */
.parch .leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border-radius:2px;border:1px solid var(--rule);box-shadow:0 3px 14px rgba(60,40,10,.3)}
.parch .leaflet-popup-tip{background:var(--paper);border:1px solid var(--rule)}
.parch .leaflet-popup-content{margin:10px 14px;font-family:var(--serif);font-size:13.5px;line-height:1.65;max-width:260px}
.parch b{font-size:15px;display:block}
.parch em{font-style:normal;font-family:var(--latin);color:var(--accent);font-size:12px;display:block;margin:1px 0 3px}

/* region fade-in & route draw */
path.reg{animation:fadein .7s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
path.route{transition:stroke-dashoffset 5.5s cubic-bezier(.45,.05,.4,1)}

@media (prefers-reduced-motion:reduce){
  path.reg{animation:none}
  path.route{transition:none}
  #card{scroll-behavior:auto}
}
/*__LAYOUT_CSS__*/
</style>
</head>

</main>

<script>
"use strict";
/* ============================================================
   Colors
   ============================================================ */
const COL = {

  html:`<p class="lede">三个都是<b>方位词</b>：以西欧为原点，按离欧洲的远近给东方排座次，本身不对应任何山川边界。</p>
  <ul>
  <li><b>近东</b>：19 世纪欧洲人对奥斯曼帝国一带的叫法——巴尔干、安纳托利亚、黎凡特、两河、埃及，离欧洲最近。当时所谓“东方问题”，就是奥斯曼衰落后这片土地归谁。</li>
  <li><b>中东</b>：19 世纪已有零星用例，1902 年美国海军战略家马汉（A. T. Mahan）在谈波斯湾的文章中使它流行，主要指近东与印度之间、波斯湾周围那一片。1939 年英军在开罗设“中东司令部”，随后二战中的广泛使用进一步扩大了这个词的范围，把不少原叫“近东”的地区也包了进去。</li>
  <li><b>远东</b>：中国、日本、朝鲜半岛，广义还包括东南亚——欧洲人绕过非洲、走海路才到得了的“最远的东方”。</li>
  <li><b>“近东”今天主要活在学术里</b>：“古代近东”指两河、埃及、黎凡特、安纳托利亚、伊朗西部这片最早的文明区——后面几条讲的多半就是它。</li>
  <li>印度次大陆和中亚通常另称“印度”与“中亚”。三个“东”都没有统一边界，图中按现代国家拼成的色块只是帮助理解早期与今日用法，不是某一年的政治版图。</li>
  </ul>
  <div class="lao">这三个名字，都是从伦敦量出来的距离。从长安看，“远东”就在自家门口，“近东”倒在万里之外。</div>`,
  draw(d){
    d.region('middleToday', '#6b3a1a', {fill:false, weight:2.2, dashArray:'7 5', opacity:.85});

    [[33.5,36.5],[31,58.5],[36,112]].forEach(t => d.line([lon,t], {color:'#5a4632', weight:1.2, opacity:.5, dashArray:'2 6'}));
    d.label(LB('近东',36.6,33.8,'region',{c:COL.near}));
    d.label(LB('中东',31.6,58.8,'region',{c:COL.middle}));
    d.label(LB('今日“中东”',17.2,47.6,'region sm',{c:'#6b3a1a'}));

    d.label(LB('印度次大陆',22.5,78.5,'note'));
    d.label(LB('中亚',42.5,66,'note'));
  }},

{ id:'crescent', ch:2, title:'新月沃地', short:'新月沃地', c:COL.crescent,
  sub:'Fertile Crescent · 肥沃的新月',
  view:[[25.6,29],[39.6,50.5]],
  legend:[['fill',COL.crescent,'新月沃地'],['fill','#9bb05a','广义：加上尼罗河谷'],['site','#2a2018','早期农业遗址']],
  html:`<p class="lede">一条新月形的可耕地带：西端从黎凡特海岸起，向北弯过叙利亚北部和土耳其东南，再顺着两河向东南直抵波斯湾。月弯里抱着的是叙利亚沙漠。</p>
  <ul>
  <li><b>得名</b>：1916 年前后由美国芝加哥大学的埃及学家布雷斯特德（J. H. Breasted）推广开来，古人没有这个词。</li>
  <li><b>为什么在这里</b>：冬季有雨，山前坡地多，河谷可以灌溉；野生的小麦、大麦、扁豆、豌豆、亚麻本来就长在这里，绵羊和山羊也在附近山地。一万多年前，人类在这里最早把它们驯化——<b>西亚的农业从这里起步</b>。</li>
  <li><b>地标</b>：哥贝克力石阵（约前 9500 年，狩猎采集者立起的巨石圈），耶利哥（最早筑有石墙和石塔的聚落之一）。</li>
  <li><b>广义</b>常把尼罗河谷也算进来（图中浅绿），新月就从埃及一路弯到波斯湾。</li>
  <li><b>今属</b>：以色列、巴勒斯坦、黎巴嫩、约旦、叙利亚、土耳其东南、伊拉克，以及伊朗西缘。</li>
  </ul>
  <p class="see">下一步：<a class="go" data-go="mesopotamia">美索不达米亚</a><a class="go" data-go="syria">叙利亚</a><a class="go" data-go="nile">尼罗河</a></p>`,
  show:['syrianDesert','zagros','taurus'],
  draw(d){
    d.region('crescentNile', '#9bb05a', {weight:1, fillOpacity:.3, dashArray:'4 3'});
    d.region('crescent', COL.crescent, {weight:2, fillOpacity:.36});
    d.pin(P('哥贝克力石阵', 37.223, 38.922, '约前 9500 年。狩猎采集者立起的巨石圈，比农业还早或几乎同时。', 'site'));
    d.pin(P('耶利哥', 31.871, 35.444, '约前 9000 年起有人定居，前 8000 年前后筑起石墙与石塔。', 'site', {left:1}));
    d.pin(P('杰尔莫', 35.55, 44.95, '约前 7000 年，扎格罗斯山前的早期农村。', 'site'));
    d.pin(P('恰塔霍裕克', 37.667, 32.828, '约前 7000 年的大型聚落，在新月之外的安纳托利亚高原上。', 'site'));
    d.label(LB('新 月 沃 地',37.9,41.2,'region',{c:COL.crescent}));
    d.label(LB('尼罗河谷（广义）',27.2,32.6,'note'));
  }},

{ id:'mesopotamia', ch:2, title:'美索不达米亚', short:'美索不达米亚', c:COL.meso,
  sub:'Μεσοποταμία · 两河之间',
  view:[[29.4,37.6],[38.6,49.4]],
  legend:[['fill',COL.meso,'美索不达米亚（两河及两岸平原）'],['dot','#2a2018','古城'],['mdot','#888','今日城市']],
  html:`<p class="lede">希腊语“两河之间”，指<b>底格里斯河</b>与<b>幼发拉底河</b>之间及两岸的平原，大体就是今天的伊拉克，是新月沃地的东半弯。</p>
  <ul>
  <li><b>北与南</b>：北部是亚述（亚述城、尼尼微），有丘陵，能靠雨水种地；南部是巴比伦尼亚，平得像桌面，全靠开渠灌溉，最南端靠近海湾的是苏美尔。两河在巴格达一带靠得最近，大致就是南北分界。</li>
  <li><b>最早的城市与文字</b>：约前 3200 年，苏美尔的乌鲁克出现了最早的文字，后来发展成楔形文字。六十进制也来自这里——一小时六十分、一圈三百六十度，都是它的遗产。</li>
  <li><b>王朝更替</b>：苏美尔城邦 → 阿卡德帝国（萨尔贡，前 24 世纪）→ 古巴比伦（汉谟拉比法典，前 18 世纪）→ 亚述帝国（前 10–前 7 世纪）→ 新巴比伦（尼布甲尼撒）→ 前 539 年被波斯的居鲁士拿下。</li>
  <li><b>和埃及的差别</b>：两河的洪水来得猛，时间又不对——春末，正赶上庄稼将熟。所以这里很早就要修堤、挖渠、立法、调集人力，城邦之间也常为水和地开战。</li>
  <li><b>今属</b>：伊拉克为主，加上叙利亚东北和土耳其东南。</li>
  </ul>`,
  show:['zagros','syrianDesert','gulf'],
  draw(d){
    d.region('mesopotamia', COL.meso, {weight:2, fillOpacity:.28});
    d.pin(P('乌鲁克', 31.322, 45.636, '约前 3200 年，最早的文字在这里出现。传说中吉尔伽美什的城。'));
    d.pin(P('乌尔', 30.962, 46.103, '苏美尔名城，有巨大的塔庙。'));
    d.pin(P('埃利都', 30.816, 45.996, '苏美尔传说中最古老的城。', 'city', {left:1}));
    d.pin(P('尼普尔', 32.127, 45.231, '苏美尔的宗教中心。'));
    d.pin(P('巴比伦', 32.542, 44.421, '汉谟拉比与尼布甲尼撒的都城。', 'city', {left:1}));
    d.pin(P('亚述城', 35.456, 43.262, '亚述的发祥地与宗教都城。', 'city', {left:1}));
    d.pin(P('尼尼微', 36.359, 43.153, '亚述帝国晚期的都城，在今摩苏尔对岸。', 'city', {left:1}));
    d.pin(P('马里', 34.550, 40.889, '幼发拉底河中游的商贸城邦。'));
    d.pin(P('泰西封', 33.094, 44.581, '后来安息与萨珊王朝的都城。'));
    d.pin(P('巴格达', 33.315, 44.366, '今伊拉克首都，762 年建城——两河最靠近处。', 'modern', {left:1}));
    d.label(LB('亚 述',36.0,44.6,'people'));
    d.label(LB('巴比伦尼亚',32.4,43.0,'people'));
    d.label(LB('苏 美 尔',31.7,46.8,'people'));
    d.label(LB('上美索不达米亚（杰兹拉）',36.2,40.6,'people'));
  }},

{ id:'syria', ch:2, title:'叙利亚', short:'叙利亚', c:COL.syria,
  sub:'Συρία · 沙姆（Bilad al-Sham）',
  view:[[29.2,32.2],[37.8,41.4]],
  legend:[['fill',COL.syria,'古代所说的“叙利亚”（黎凡特）'],['dash','#555','今天的叙利亚国界']],
  html:`<p class="lede">古代说的“叙利亚”远比今天的国家大：北起托罗斯山脚，南到西奈，西临地中海，东到沙漠边——整个<b>黎凡特</b>都算。</p>
  <ul>
  <li><b>得名</b>：希腊人的叫法，多数学者认为是“亚述”（Assyria）的缩略。阿拉伯语叫“沙姆”（Bilad al-Sham）。</li>
  <li><b>一条走廊</b>：西边是海，东边是沙漠，埃及、两河、安纳托利亚之间的陆路都得从这条窄带过，于是历代大国都在这里相撞。前 1274 年埃及的拉美西斯二世与赫梯在卡迭石大战，十几年后双方签下现存最早的和约之一。</li>
  <li><b>海岸</b>是腓尼基人的城市（提尔、西顿、比布鲁斯）。他们把字母带遍地中海，希腊字母、拉丁字母都由此而来。</li>
  <li><b>希腊罗马时代</b>：亚历山大死后，这里是塞琉古王国的心脏，都城安条克；前 64 年庞培把它设为罗马的叙利亚行省，安条克成了帝国东方仅次于亚历山大里亚的大城。</li>
  <li><b>今天</b>：一战后英法瓜分，北半归法国（分出叙利亚与黎巴嫩），南半归英国（巴勒斯坦与外约旦）。古都安条克 1939 年划给了土耳其，即今天的安塔基亚。</li>
  </ul>`,
  show:['syrianDesert','lebanon','taurus'],
  draw(d){
    d.region('syria', COL.syria, {weight:2, fillOpacity:.3});
    d.region('syriaModern', '#555', {fill:false, weight:1.8, dashArray:'6 5', opacity:.9});
    d.pin(P('安条克', 36.202, 36.160, '塞琉古王国与罗马叙利亚行省的都城。今属土耳其，名安塔基亚。', 'city', {left:1}));
    d.pin(P('阿勒颇', 36.20, 37.16, '叙利亚北部的商路枢纽。'));
    d.pin(P('乌加里特', 35.602, 35.782, '约前 14 世纪的港城，出土了最早的字母表之一。', 'site', {left:1}));
    d.pin(P('卡迭石', 34.557, 36.519, '前 1274 年，埃及与赫梯在此大战。', 'battle'));
    d.pin(P('巴尔米拉', 34.551, 38.269, '沙漠商队城。3 世纪女王芝诺比娅一度割据，与罗马对抗。'));
    d.pin(P('比布鲁斯', 34.121, 35.648, '腓尼基古城。希腊人从这里进口纸草，希腊语“书”（biblion）由此得名——Bible 一词也是。', 'city', {left:1}));
    d.pin(P('西顿', 33.563, 35.371, '腓尼基城市。', 'city', {left:1}));
    d.pin(P('提尔', 33.271, 35.196, '腓尼基城市，迦太基的母邦。', 'city', {left:1}));
    d.pin(P('大马士革', 33.513, 36.292, '世界上持续有人居住最久的城市之一。'));
    d.pin(P('耶路撒冷', 31.778, 35.235, ''));
    d.label(LB('腓 尼 基',34.75,34.75,'people'));
    d.label(LB('黎凡特',32.6,36.6,'region sm',{c:COL.syria}));
  }},

{ id:'nile', ch:2, title:'尼罗河', short:'尼罗河', c:COL.nile,
  sub:'Νεῖλος · 埃及人只叫它“河”（iteru）',
  view:[[-4,22.5],[32.5,43]],
  legend:[['line',COL.nile,'尼罗河水系'],['cat','#235f93','第一至第六瀑布']],
  html:`<p class="lede">世界最长的河之一（约 6,650 公里），<b>由南向北</b>流，穿过撒哈拉，把一条绿带一直送进地中海。</p>
  <ul>
  <li><b>两个源头</b>：白尼罗河出自维多利亚湖一带，水量稳定；青尼罗河出自埃塞俄比亚的塔纳湖，夏季风雨让它暴涨。两河在喀土穆汇合。</li>
  <li><b>洪水从哪来</b>：到达埃及的河水，八成以上来自埃塞俄比亚高原（青尼罗河、阿特巴拉河、索巴特河）。每年 6 月起涨，8–9 月最高，退水后留下一层黑泥，田地年年自动施肥。古埃及人把一年分成泛滥、生长、收获三季。</li>
  <li><b>六道瀑布</b>：阿斯旺到喀土穆之间有六处急流险滩（图中 Ⅰ–Ⅵ），船过不去，也就挡住了埃及往南；瀑布之间是努比亚，古称库施。</li>
  <li><b>水往北流，风往南吹</b>：顺流漂下去北方，扬帆逆流回南方。象形文字里“往南走”画的正是一条张帆的船。</li>
  <li>1970 年阿斯旺高坝建成，持续了几千年的年度洪水从此消失。</li>
  </ul>
  <div class="lao">有一篇托名老夫的《论尼罗河泛滥》，说洪水来自埃塞俄比亚夏天的大雨。希罗多德没想通的事，这回说对了。</div>`,
  show:['sahara','red','arabia'],
  draw(d){
    ['nile','bluenile','atbara','sobat','kagera'].forEach(k => d.river(k, {color:COL.nile, weight:k==='nile'?3.4:2.4, opacity:.95}));
    GEO.cataracts.forEach(c => d.pin({n:c.t==='Ⅰ'?'阿斯旺':'', ll:c.ll,
      note:'第'+c.t+'瀑布。'+(c.t==='Ⅰ'?'阿斯旺附近，古埃及的南界；高坝于 1970 年建成。':c.t==='Ⅱ'?'瓦迪哈勒法附近，今天已被纳赛尔湖淹没。':'尼罗河上的急流险滩。'), kind:'cat', icon:c.t}));
    d.pin(P('喀土穆', 15.6, 32.53, '白尼罗河与青尼罗河在此汇合。', 'modern', {left:1}));
    d.pin(P('开罗', 30.04, 31.24, '三角洲的顶点。', 'modern', {left:1}));
    d.pin({n:'维多利亚湖', ll:[-1.2,33.0], kind:'lake', note:'白尼罗河的源头之湖。'});
    d.pin({n:'塔纳湖', ll:[12.0,37.3], kind:'lake', note:'青尼罗河的源头之湖，在埃塞俄比亚高原上。'});
    d.label(LB('埃塞俄比亚高原',9.3,39.3,'mtn'));
    d.label(LB('苏德沼泽',7.6,27.6,'note'));
    d.label(LB('约一半的来水在湿地蒸散',6.8,27.6,'note'));
    d.label(LB('努 比 亚',20.6,33.4,'people'));
    d.label(LB('埃 及',27.0,32.6,'people'));
  }},

{ id:'egypt', ch:2, title:'埃及', short:'埃及', c:COL.egypt,
  sub:'Αἴγυπτος · 凯美特（黑土地）',
  view:[[21.6,24.6],[32.0,35.6]],
  legend:[['fill',COL.egypt,'“黑土地”：河谷、三角洲与法尤姆'],['dash','#555','今天的埃及国界']],
  html:`<p class="lede">埃及＝尼罗河两岸十几公里宽的绿带，加上下游的三角洲，其余全是沙漠。希罗多德说：<b>埃及是尼罗河的赠礼</b>。</p>
  <ul>
  <li><b>黑与红</b>：埃及人自称“凯美特”（黑土地，指河泥），沙漠叫“德什雷特”（红土地）。“埃及”一词出自希腊语 Aigyptos，一般认为源自孟菲斯一座普塔神庙的名字。</li>
  <li><b>上下颠倒</b>：按水流命名——上游的南方河谷叫上埃及，下游的北方三角洲叫下埃及，正好与地图的上下相反。约前 3100 年两地统一，法老的双冠就是上下埃及两顶王冠合在一起。</li>
  <li><b>天然城墙</b>：东西两侧是沙漠，南有瀑布，北是海，唯一的陆上门户在东北，经西奈通往叙利亚。外敌难入，所以三千年间文化出奇地稳定。</li>
  <li><b>时间线</b>：吉萨金字塔（前 26 世纪）→ 新王国定都底比斯 → 前 525 年被波斯征服 → 前 332 年迎来亚历山大 → 托勒密王朝（末代女王克娄巴特拉，Cleopatra）→ 前 30 年成为罗马行省，罗马的粮仓。</li>
  <li><b>今天</b>：九成以上的埃及人仍住在只占国土约二十分之一的河谷和三角洲上。</li>
  </ul>`,
  show:['libyanDesert','sinai','red'],
  draw(d){
    d.region('egyptModern', '#555', {fill:false, weight:1.6, dashArray:'6 5', opacity:.85});
    d.region('egypt', COL.egypt, {weight:1.2, fillOpacity:.55});

{ id:'anatolia', ch:2, title:'安纳托利亚', short:'安纳托利亚', c:COL.anatolia,
  sub:'Ἀνατολή · 小亚细亚（Asia Minor）',
  view:[[35.6,25.6],[42.4,45.0]],
  legend:[['fill',COL.anatolia,'安纳托利亚（今土耳其亚洲部分）'],['seal','','老夫行迹']],
  html:`<p class="lede">今天土耳其的<b>亚洲部分</b>，又称小亚细亚：三面环海的大半岛，中间是平均海拔约一千米的高原，西隔海峡与欧洲相望。</p>
  <ul>
  <li><b>得名</b>：希腊语 anatolē，意为“日出之处”，即东方。“小亚细亚”是后来为区别于整个亚洲而起的叫法。</li>
  <li><b>地形</b>：北有本都山脉，南有托罗斯山脉，夹着干冷的中部高原；温暖湿润的西海岸河谷通向爱琴海。</li>
  <li><b>文明之桥</b>：赫梯人（都城哈图沙）、特洛伊、弗里吉亚（迈达斯王，都城戈尔迪乌姆）、吕底亚（都城萨迪斯，最早铸币的地方之一）。西海岸是希腊人的爱奥尼亚——泰勒斯在米利都开启了希腊哲学。</li>
  <li><b>哈利斯河</b>（今克孜勒河）曾是吕底亚与米底的界河。前 547 年吕底亚王克罗伊斯渡河进攻波斯，应了神谕“一个大帝国将会毁灭”——毁的是他自己。</li>
  <li><b>之后</b>：波斯、亚历山大、罗马的亚细亚诸行省，再到拜占庭的腹地；1071 年曼齐刻尔特之战后突厥人进入，这里逐渐成为今天的土耳其。</li>
  <li><b>东界有弹性</b>：古典的小亚细亚到幼发拉底河上游为止，再往东是亚美尼亚高原；现代土耳其语的 Anadolu 则指整个亚洲部分（图中所示）。</li>
  </ul>
  <div class="lao">前 347 年柏拉图去世，老夫离开雅典，渡海到小亚细亚的阿索斯，在那里住了三年。</div>`,

{ id:'iranPlateau', ch:3, title:'伊朗高原', short:'伊朗高原', c:COL.iran,
  sub:'Iranian Plateau · “雅利安人之地”',
  view:[[24.2,43.0],[40.4,73.5]],
  legend:[['fill',COL.iran,'伊朗高原（自然地理范围示意）']],
  html:`<p class="lede">夹在两河平原与印度河之间的一大块高地：四周是山，中间是盐漠，平均海拔一千米以上。</p>
  <ul>
  <li><b>山的边框</b>：西南是扎格罗斯山脉，北面是厄尔布尔士山脉（最高峰达马万德峰，约 5,600 米），东北是科佩特山，东边接阿富汗的兴都库什山和巴基斯坦的苏莱曼山。</li>
  <li><b>空心的中央</b>：卡维尔盐漠与卢特沙漠几乎无人，后者是地球表面测得温度最高的地方之一。人住在山脚的绿洲上，靠坎儿井（qanat）把山下的地下水引出来。</li>
  <li><b>两支民族</b>：前一千纪，说伊朗语的米底人在西北建国（都城埃克巴坦那，今哈马丹），波斯人在西南（今法尔斯省）。“伊朗”一词即来自“雅利安人（之地）”。</li>
  <li><b>通道</b>：高原北缘、厄尔布尔士山南麓那条线（呼罗珊大道）是连接两河与中亚的主路，后来成了丝绸之路的一段。</li>
  <li><b>今属</b>：伊朗为主，加上阿富汗大部和巴基斯坦西部（俾路支）。</li>
  </ul>`,

{ id:'persia', ch:3, title:'波斯', short:'波斯', c:COL.persia,
  sub:'Pārsa · Περσίς',
  view:[[18,17],[47,77]],
  legend:[['fill',COL.persia,'波斯本部（法尔斯）'],['dash',COL.persia,'阿契美尼德帝国，约前 500 年'],['line','#b8860b','御道（萨迪斯—苏萨）']],
  html:`<p class="lede">本是伊朗高原西南一个地区的名字（古波斯语 Pārsa，今法尔斯省）。那里兴起了阿契美尼德王朝，希腊人便把整个帝国都叫作“波斯”。</p>
  <ul>
  <li><b>崛起</b>：前 550 年居鲁士大帝推翻米底，随后吞并吕底亚（前 547）、巴比伦（前 539）；其子冈比西斯征服埃及（前 525）。</li>
  <li><b>极盛</b>：大流士一世时，西起色雷斯和利比亚，东到印度河，约 550 万平方公里，是当时世界上最大的国家（图中蓝色虚线范围）。全国分为二十多个行省，各设总督，地方宗教与习俗大体照旧。</li>
  <li><b>御道</b>：从萨迪斯到苏萨约 2,700 公里，沿途 111 个驿站。步行要走三个月，驿马接力大约一周可到。希罗多德赞叹“无论雪雨、酷暑还是黑夜，都阻止不了这些信使”——这句话今天刻在纽约一座邮政大楼的门楣上。</li>
  <li><b>都城不止一个</b>：苏萨、巴比伦、埃克巴坦那按季节轮住；波斯波利斯是举行礼仪的王都；帕萨尔加德有居鲁士墓。</li>
  <li><b>与希腊</b>：前 490 年马拉松、前 480 年萨拉米斯，两次西征都没拿下希腊本土；前 330 年帝国亡于亚历山大。之后伊朗高原又兴起安息（帕提亚）与萨珊两大王朝，与罗马对峙约七百年。</li>
  <li><b>名字</b>：1935 年伊朗政府要求各国改称“伊朗”。中文“波斯”即 Pārsa 的音译；汉代所说的“安息”是帕提亚。</li>
  </ul>`,

{ id:'aegean', ch:4, title:'爱琴海', short:'爱琴海', c:COL.aegean,
  sub:'Αἰγαῖον πέλαγος',
  view:[[34.6,21.6],[41.3,29.0]],
  legend:[['fill',COL.aegean,'爱琴海'],['seal','','老夫行迹']],
  html:`<p class="lede">希腊半岛与安纳托利亚之间的海。南边由克里特岛封口，东北经达达尼尔海峡、马尔马拉海和博斯普鲁斯海峡通往黑海。</p>
  <ul>
  <li><b>岛屿如阶</b>：中部是基克拉泽斯群岛（意为“环状群岛”，环绕圣岛提洛），东南是多德卡尼斯群岛，北边贴近小亚细亚的是莱斯博斯、希俄斯、萨摩斯。在这片海上航行，几乎随时都望得见下一座岛——早期的航海者就是在这里学会出海的。</li>
  <li><b>风</b>：夏季吹稳定的北风（梅尔特米风，古称埃特西亚风），航海季就是夏天；冬季风暴多，船几乎都靠岸。</li>
  <li><b>名字</b>：传说来自雅典国王埃勾斯——他以为儿子忒修斯死在了克里特，投海自尽。</li>
  <li><b>文明序列</b>：克里特岛的米诺斯文明（克诺索斯）→ 希腊本土的迈锡尼文明 → 荷马笔下的特洛伊战争 → 古典希腊。约前 1600 年锡拉岛（今圣托里尼）火山大爆发，是这片海上最大的天灾。</li>
  <li><b>今属</b>：海中岛屿绝大多数属希腊，东岸属土耳其，两国至今在领海和领空上争执不断。</li>
  </ul>
  <div class="lao">老夫在莱斯博斯岛的皮拉潟湖边住过两年，解剖章鱼，看鱼产卵，数海胆的牙。动物学就是在这片海边开始的。</div>`,

{ id:'greek', ch:4, title:'希腊世界', short:'希腊世界', c:COL.greek,
  sub:'Ἑλλάς · 希伦人的世界',
  view:[[29.4,-1],[47.5,42.5]],
  legend:[['fill',COL.greek,'希腊本土、爱琴海与爱奥尼亚'],['fill','#6f93c9','大希腊（南意大利与西西里）'],['dot','#2a5aa0','殖民城邦'],['seal','','老夫行迹']],
  html:`<p class="lede">古希腊从来不是一个国家，而是<b>一千多个城邦</b>结成的网，撒在地中海和黑海沿岸。柏拉图说，希腊人围着海住，<b>“像蚂蚁和青蛙围着池塘”</b>。</p>
  <ul>
  <li><b>核心</b>：希腊半岛、爱琴海诸岛和小亚细亚西海岸。山把半岛切成一块块小平原，一块平原养一个城邦——雅典、斯巴达、科林斯、底比斯各自为政。</li>
  <li><b>大殖民</b>（前 8–前 6 世纪）：人多地少，就出海建新城。西到南意大利和西西里（罗马人称“大希腊”），远到今法国的马赛和西班牙；北到黑海沿岸；南到利比亚的昔兰尼。</li>
  <li><b>凭什么算一个“世界”</b>：不靠政治，靠共同的语言（他们自称希伦人，外人一概是说话“叽里咕噜”的 barbaroi）、荷马史诗、德尔斐神谕和四年一度的奥林匹亚赛会。</li>
  <li><b>拉丁字母的来历</b>：意大利库迈的希腊殖民者把字母教给伊特鲁里亚人，再传给罗马人——你现在看到的拉丁字母就是这样来的。</li>
  <li>亚历山大之后，希腊语和希腊式城市一路铺到埃及、两河和中亚，称为<b>希腊化世界</b>。</li>
  </ul>
  <div class="lao">老夫和学生们收集整理过 158 个城邦的政制，只有一篇《雅典政制》留到了今天。</div>`,
  show:['med','black','aegean','ionian'],
  draw(d){
    d.region('greekCore', COL.greek, {weight:1.4, fillOpacity:.35});
    d.region('magnaGraecia', '#6f93c9', {weight:1.2, fillOpacity:.35});
    const core = [['斯巴达',37.08,22.43,'',1],['科林斯',37.91,22.88,'地峡上的商业城邦，叙拉古的母邦。',0],['底比斯',38.32,23.32,'',0],
      ['德尔斐',38.48,22.50,'阿波罗神谕所，“世界的肚脐”。',1],['奥林匹亚',37.64,21.63,'前 776 年起四年一度的赛会。',1],['米利都',37.53,27.28,'爱奥尼亚最大的城，自己就建了几十座殖民城。',0]];

{ id:'balkans', ch:4, title:'巴尔干', short:'巴尔干', c:COL.balkans,
  sub:'Balkan · 古称海穆斯（Haemus）',
  view:[[35.6,12.6],[46.6,30.6]],
  legend:[['fill',COL.balkans,'巴尔干半岛（以多瑙河—萨瓦河为北界）'],['line',COL.nile,'多瑙河、萨瓦河、库帕河']],
  html:`<p class="lede">欧洲东南角的大半岛，西临亚得里亚海和伊奥尼亚海，南临爱琴海，东临黑海；北界通常取<b>多瑙河—萨瓦河</b>一线。希腊半岛是它的南端。</p>
  <ul>
  <li><b>得名</b>：土耳其语 balkan，意为“林木覆盖的山”，原是保加利亚境内一条山脉的名字（古称海穆斯山）。1808 年德国地理学家措伊内误以为这条山横贯整个半岛，就用它给半岛命名。</li>
  <li><b>多山</b>：迪纳拉山脉、品都斯山脉、巴尔干山脉、罗多彼山脉把半岛切成许多互不相通的河谷和盆地，民族与政权也跟着碎成小块——“巴尔干化”一词由此而来。</li>
  <li><b>古代族群</b>：西部是伊利里亚人，东部是色雷斯人，南部是马其顿人和希腊人；多瑙河以北是达契亚人。</li>
  <li><b>此后</b>：罗马在这里设伊利里库姆、默西亚、色雷斯、马其顿、亚该亚诸行省；之后先后归拜占庭与奥斯曼，19 世纪“东方问题”的主战场就在这里，1914 年一战的导火索也在萨拉热窝点燃。</li>
  <li><b>今属</b>：希腊、阿尔巴尼亚、北马其顿、保加利亚、塞尔维亚、黑山、波黑、科索沃，克罗地亚大部，以及土耳其的欧洲部分、罗马尼亚的多布罗加。</li>
  </ul>`,
  show:['pindus','balkanmts','dinaric','rhodope','carpathians','adriatic','aegean','black','ionian'],
  draw(d){
    d.region('balkans', COL.balkans, {weight:2, fillOpacity:.2});

    d.pin(P('君士坦丁堡（拜占庭）', 41.01, 28.98, '330 年起为君士坦丁堡，东罗马与奥斯曼的都城。'));
    d.pin(P('贝尔格莱德', 44.82, 20.46, '萨瓦河汇入多瑙河处，罗马时代叫辛吉杜努姆。', 'modern'));
    d.pin(P('萨拉热窝', 43.86, 18.41, '1914 年，一战的导火索在此点燃。', 'modern'));
    d.pin(P('塞萨洛尼基', 40.64, 22.94, '', 'city', {left:1}));
    d.pin(P('雅典', 37.97, 23.73, ''));
    d.label(LB('伊利里亚人',42.55,19.6,'people'));
    d.label(LB('色雷斯人',41.95,26.3,'people'));
    d.label(LB('马其顿人',40.95,21.6,'people'));
    d.label(LB('希腊人',38.9,22.0,'people'));
    d.label(LB('达契亚人',45.9,24.6,'people'));
  }},

{ id:'macedon', ch:4, title:'马其顿', short:'马其顿', c:COL.macedon,
  sub:'Μακεδονία',
  view:[[38.3,20.0],[42.1,25.4]],
  legend:[['fill',COL.macedon,'马其顿本土（腓力二世时代，概略）'],['dash','#555','今天的北马其顿共和国'],['seal','','老夫行迹']],
  html:`<p class="lede">希腊半岛北部的古王国，在奥林匹斯山以北、塞尔迈湾周围。它在希腊世界的边缘，被南方城邦看作半个蛮族，最后却统一了希腊。</p>
  <ul>
  <li><b>地理</b>：沿海是平原（下马其顿），内陆是山地小王国（上马其顿）。木材、马匹、牧场、潘盖翁山的金矿——南方城邦缺的这里都有。</li>
  <li><b>都城</b>：先在埃盖（今维尔吉纳，1977 年在此发现推测为腓力二世的王陵），约前 400 年迁到更靠海的佩拉。</li>
  <li><b>腓力二世</b>（前 359–前 336 年在位）：练出手持五六米长矛（萨里沙）的方阵，夺取安菲波利斯和金矿；前 338 年在喀罗尼亚击败雅典与底比斯联军，从此马其顿主宰希腊。前 336 年他在埃盖遇刺，儿子亚历山大继位，年方二十。</li>
  <li><b>今天</b>：古马其顿的核心大部分在希腊北部的马其顿大区，首府塞萨洛尼基。北边的国家 2019 年改名“北马其顿”，正是为了和希腊的这片地区区分开。图中只示意马其顿本土，不把腓力对色萨利、色雷斯及全希腊的控制都画作同一种国境。</li>
  </ul>
  <div class="lao">老夫生在东边的斯塔基拉，父亲是马其顿王阿明塔斯的御医。前 343 年，腓力请老夫到米埃扎的宁芙圣所，教他十三岁的儿子——就是后来的亚历山大。</div>`,
  show:['pindus','aegean'],
  draw(d){
    d.region('northMacedonia', '#555', {fill:false, weight:1.8, dashArray:'6 5', opacity:.85});
    d.region('macedon', COL.macedon, {weight:2.2, fillOpacity:.25});
    ['haliacmon','strymon','nestos'].forEach(k => d.river(k, {color:COL.nile, weight:1.8, opacity:.8}));
    d.pin(P('佩拉', 40.759, 22.523, '约前 400 年起的都城，亚历山大的出生地。', 'big'));
    d.pin(P('埃盖（维尔吉纳）', 40.479, 22.318, '旧都与王陵所在，腓力二世在此遇刺。', 'city', {left:1}));
    d.pin(P('米埃扎', 40.643, 22.120, '前 343–前 340 年，老夫在此教亚历山大。', 'lao', {left:1}));
    d.pin(P('斯塔基拉', 40.533, 23.750, '前 384 年，老夫生于此。', 'lao'));
    d.pin(P('安菲波利斯', 40.822, 23.847, '前 357 年为腓力所取。', 'city', {left:1}));
    d.pin(P('腓立比', 41.013, 24.284, '腓力以自己的名字命名，附近有金矿。'));
    d.pin(P('潘盖翁山', 40.92, 24.08, '金银矿所在，马其顿的钱袋子。', 'peak', {left:1}));
    d.pin(P('奥林索斯', 40.296, 23.354, '前 348 年被腓力夷平。', 'city', {left:1}));
    d.pin(P('塞萨洛尼基', 40.640, 22.944, '前 315 年建城，以亚历山大的异母妹妹命名。'));
    d.pin(P('奥林匹斯山', 40.086, 22.359, '2,918 米，希腊最高峰，诸神之山。', 'peak', {left:1}));
    d.pin(P('喀罗尼亚', 38.50, 22.85, '前 338 年，马其顿在此击败雅典与底比斯。', 'battle'));
    d.label(LB('上马其顿',40.45,21.35,'people'));
    d.label(LB('卡尔基狄克',40.05,23.7,'people'));
    d.label(LB('色萨利',39.45,22.2,'people'));
    d.label(LB('色雷斯',41.4,25.0,'people'));
    d.label(LB('塞尔迈湾',40.3,22.75,'note'));
  }},

{ id:'alexander', ch:4, title:'亚历山大东征', short:'亚历山大东征', c:COL.alex,
  sub:'前 334 – 前 323',
  view:[[22,19],[44.5,78]],
  legend:[['line',COL.alex,'亚历山大的行军路线'],['dline','#1f4e79','尼阿库斯的舰队'],['dash',COL.persia,'被征服的波斯帝国']],
  html:`<p class="lede">马其顿国王亚历山大从佩拉出发，十一年间<b>打穿整个波斯帝国</b>，一直走到印度河以东，最后死在巴比伦，年仅三十二岁。</p>
  <ul>
  <li><b>三战定波斯</b>：格拉尼库斯（前 334）、伊苏斯（前 333）、高加米拉（前 331）。此后是在中亚苦战三年，再打进印度。</li>
  <li><b>边走边建城</b>：沿途建起十几座“亚历山大里亚”，从埃及一直到今天的阿富汗和塔吉克斯坦，最有名的是埃及那座。</li>
  <li><b>回头</b>：前 326 年在希发西斯河（今比亚斯河），士兵拒绝再往东走，他只得回师；穿越格德罗西亚沙漠时损失惨重。舰队由尼阿库斯率领，沿海岸驶回波斯湾（图中蓝色虚线）。</li>
  <li><b>身后</b>：帝国被部将瓜分——托勒密得埃及，塞琉古得叙利亚到伊朗，安提柯家族得马其顿。从此到前 30 年埃及并入罗马，称为希腊化时代。</li>
  </ul>
  <p class="hint">点时间线上的某一站，地图会飞过去。</p>
  <ol class="tl" id="tl"></ol>
  <div class="lao">他行军时，枕头底下压着老夫校订的《伊利亚特》。老夫的侄孙卡利斯提尼随军写史，前 327 年因反对跪拜礼获罪而死。老夫教得了他读荷马，没教会他节制。</div>`,
  show:['caspian','gulf','hindukush','zagros','black','med','arabian'],
  draw(d){
    d.region('achaemenid', COL.persia, {weight:1.6, fillOpacity:.06, dashArray:'8 5'});

    ['indus','jhelum','beas','oxus','jaxartes'].forEach(k => d.river(k, {color:COL.nile, weight:1.6, opacity:.75}));
    const LEFT = new Set([0,1,3,4,8,9,10,12,15,16,17,18,25,27,28]);
    ALEX_STOPS.forEach((s,i) => {
      const late = ALEX_LATE.filter(x => x[2]===i);
      const note = s[4] + late.map(x => `<br><em>${x[1]}</em>${x[3]}`).join('');
      d.pin({n:s[0], ll:[s[2],s[3]], kind:'num', icon:String(i+1), note:`<em>${s[1]}</em>${note}`, left:LEFT.has(i), battle:s[5]==='battle', key:'a'+i,
        labelZ:[0,6,9,11,12,20,25,29].includes(i)?0:6});
    });
    d.label(LB('波斯帝国',33.2,58.5,'region sm',{c:COL.persia}));
  }},

{ id:'adriatic', ch:5, title:'亚得里亚海', short:'亚得里亚海', c:COL.adriatic,
  sub:'Mare Adriaticum',
  view:[[39.2,11.6],[46.3,29.4]],
  legend:[['fill',COL.adriatic,'亚得里亚海'],['line','#8a1c1c','阿庇亚大道 → 渡海 → 埃格纳提亚大道']],
  html:`<p class="lede">意大利半岛与巴尔干之间的狭长海湾，长约 800 公里；南口的奥特朗托海峡最窄处只有约 72 公里，外接伊奥尼亚海。</p>
  <ul>
  <li><b>得名</b>：来自波河口附近的古港阿德里亚（Adria）。如今泥沙淤积，它已离海二十多公里。</li>
  <li><b>两岸迥异</b>：西岸（意大利）平直，少良港；东岸（达尔马提亚）山海相逼，岸线曲折，大小岛屿上千座。</li>
  <li><b>罗马跨海的第一步</b>：前 229 年，罗马为打击伊利里亚海盗第一次出兵对岸。此后的经典路线是：沿阿庇亚大道到布伦迪西乌姆（今布林迪西），渡海约 150 公里到都拉基乌姆（今阿尔巴尼亚都拉斯），再走埃格纳提亚大道横穿巴尔干，经马其顿直达拜占庭。</li>
  <li><b>后来</b>：拉文纳是罗马帝国的舰队基地，402 年起成为西罗马首都；中世纪的威尼斯称霸这片海，号称“亚得里亚海的女王”。东岸斯普利特的老城，就建在戴克里先皇帝退位后所住的宫殿里。</li>
  </ul>`,

    d.pin(P('布伦迪西乌姆', 40.64, 17.94, '阿庇亚大道的终点，渡海港口。', 'city', {left:1}));
    d.pin(P('都拉基乌姆', 41.32, 19.45, '埃格纳提亚大道的起点。'));

{ id:'apennine', ch:5, title:'亚平宁半岛', short:'亚平宁', c:COL.apennine,
  sub:'Appennini · 意大利半岛',
  view:[[36.4,6.6],[47.0,19.2]],
  legend:[['fill',COL.apennine,'亚平宁半岛'],['fill','#c2a25a','波河平原（古称“山南高卢”）'],['dline','#6d4b2a','亚平宁山脉走向']],
  html:`<p class="lede">就是意大利半岛，因纵贯全境、长约 1,200 公里的<b>亚平宁山脉</b>而得名，形状像一只伸进地中海的靴子。</p>
  <ul>
  <li><b>半岛本体</b>从亚平宁北麓起，广义的意大利地域则北抵阿尔卑斯山。山下的波河平原是意大利最肥的土地，但古罗马人很长时间不把它算作“意大利”，称它“山南高卢”，因为那里住着高卢人。界河是小小的卢比孔河——恺撒前 49 年带兵越过它，内战爆发，“渡过卢比孔河”从此成了“破釜沉舟”的意思。</li>
  <li><b>山脉偏东</b>：亚平宁山贴着亚得里亚海一侧走，西坡留下较宽的平原和丘陵（伊特鲁里亚、拉丁姆、坎帕尼亚），所以重要城市多在西边。</li>
  <li><b>古代族群</b>：北有伊特鲁里亚人，中有拉丁人、萨宾人和山里的萨莫奈人，南部海岸是希腊殖民城邦（“大希腊”），波河流域是高卢人。</li>
  <li><b>位置</b>：半岛伸进地中海正中，东望希腊，南经西西里与迦太基隔海相对——罗马能统治整个地中海，这是地理上的底牌。</li>
  <li><b>“意大利”这个名字</b>起初只指半岛最南端的一角（今卡拉布里亚），随罗马扩张一路北移，直到前 1 世纪后期才覆盖到阿尔卑斯山下。</li>
  </ul>`,
  show:['alps','tyrrhenian','adriatic','ionian'],
  draw(d){
    d.region('poValley', '#c2a25a', {weight:1.2, fillOpacity:.35});
    d.region('apennine', COL.apennine, {weight:2, fillOpacity:.22});
    d.line(APENNINE_SPINE, {color:'#6d4b2a', weight:4, opacity:.75, dashArray:'10 6'});
    ['po','tiber','arno'].forEach(k => d.river(k, {color:COL.nile, weight:2, opacity:.85}));
    d.pin(P('卢比孔河', 44.10, 12.40, '前 49 年 1 月，恺撒率军渡过此河。', 'site'));

{ id:'rome', ch:5, title:'罗马', short:'罗马', c:COL.rome,
  sub:'Roma · 先是一座城',
  view:[[37.7,9.6],[44.6,18.6]],
  legend:[['fill',COL.rome,'约前 264 年罗马控制的意大利'],['line','#8a1c1c','从罗马辐射出的大道']],
  html:`<p class="lede">先是一座城：在台伯河下游东岸，离海约 25 公里，建在七座小山上。后来它的名字成了一个国家、一个帝国。</p>
  <ul>
  <li><b>选址</b>：台伯岛让这里成为河上最好的渡口；海边的盐沿着“盐路”（萨拉里亚大道）从这里运进内陆；城又正好卡在北面伊特鲁里亚与南面拉丁姆的交界——商路与边界的交点。</li>
  <li><b>三段</b>：传说前 753 年罗慕路斯建城（王政）；前 509 年驱逐国王，建立共和国；前 27 年屋大维称“奥古斯都”，进入帝制。</li>
  <li><b>从城到半岛</b>：约前 264 年，罗马已控制阿尔诺河—卢比孔河以南的整个半岛（图中红色）。随后三次布匿战争打败迦太基，前 146 年同一年里毁了迦太基和科林斯，成为地中海霸主。</li>
  <li><b>条条大路</b>：前 312 年动工的阿庇亚大道是第一条，此后弗拉米尼亚、奥勒利亚、萨拉里亚等大道从城门辐射出去，图上画了几条。</li>
  <li><b>今天</b>是意大利首都，城中还套着一个国家——梵蒂冈。</li>
  </ul>`,

{ id:'italia', ch:5, title:'意大利的分野', short:'意大利诸区', c:COL.italia,
  sub:'Italia · 半岛上的几块地方',
  view:[[37.7,7.4],[46.4,18.8]],
  legend:[['fill',COL.etruria,'半岛诸区：古代族群地名，边界大致依奥古斯都的分区'],['fill','#cdbb86','山南高卢：波河流域，前42年才并入意大利'],['dline','#5a2a1a','意大利本土与山南高卢的界线（示意）']],
  html:`<p class="lede">罗马人嘴里的“意大利”，很长时间只指卢比孔河以南的半岛。半岛又按族群分成几块，每一块都牵着一段罗马史。</p>
  <ul>
  <li><b>伊特鲁里亚（Etruria）</b>：台伯河以北，今托斯卡纳。伊特鲁里亚人会冶铁、做买卖，罗马王政晚期的塔克文王族就从这里来；前396年罗马攻灭了近邻维爱。</li>
  <li><b>拉丁姆与坎帕尼亚（Latium, Campania）</b>：亚平宁西坡的平原。拉丁姆是拉丁人的老家，罗马在它北缘；坎帕尼亚是维苏威火山下最肥的地，卡普阿、那不勒斯、庞贝都在这里，罗马和萨莫奈人就是为争它打起来的。</li>
  <li><b>中部山地（Samnium 等）</b>：亚平宁中段的山民，北有萨宾人、马尔西人、佩利尼人，南有萨莫奈人。罗马同萨莫奈人打了三次战争（前343—前290年）；前91年起兵的盟邦也以这些山民为主力，把科尔菲尼乌姆改名“意大利”当首都。</li>
  <li><b>亚得里亚海一侧</b>：翁布里亚（Umbria）和皮切努姆（Picenum）。庞培家在皮切努姆有大片地产，前83年他就在这里自掏腰包募了三个军团去投苏拉。</li>
  <li><b>南部</b>：阿普利亚（Apulia）是坎尼战场所在；卢卡尼亚（Lucania）和布鲁提乌姆（Bruttium）多山，汉尼拔在布鲁提乌姆一直待到前203年。沿海的希腊城邦合称“大希腊”，塔伦图姆最大。</li>
  <li><b>后来</b>：奥古斯都把意大利分成十一个区，名字大多沿用这些族群地名。今天的大区名托斯卡纳、翁布里亚、拉齐奥、坎帕尼亚、普利亚，还看得出来历；只是古代的“卡拉布里亚”指靴跟，不是今天的靴尖。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="apennine">亚平宁半岛</a><a class="go" data-go="cisalpine">山南高卢与卢比孔河</a><a class="go" data-go="history-rome-social">同盟者战争</a></p>`,

{ id:'cisalpine', ch:5, title:'山南高卢与卢比孔河', short:'山南高卢', c:COL.cisalpine,
  sub:'Gallia Cisalpina · 阿尔卑斯山这一侧的高卢',
  view:[[43.4,6.7],[46.6,14.0]],
  legend:[['fill','#c2a25a','波河以南（Cispadana）'],['fill','#9aa35c','波河以北（Transpadana，含维内蒂人地区）'],['fill','#5f8a8b','利古里亚'],['dline','#5a2a1a','与意大利本土的界线（示意）']],
  html:`<p class="lede">波河平原，意大利最肥的土地。罗马人叫它“山这边的高卢”（Gallia Cisalpina），山指阿尔卑斯山，因为前400年前后起住在这里的是高卢人。共和时代它是一个行省，不算意大利，东南边的界河就是卢比孔河。</p>
  <ul>
  <li><b>高卢人与罗马</b>：前390年前后攻破罗马的高卢人，就是翻过阿尔卑斯山、经这片平原南下的。前225年罗马在泰拉蒙大败高卢联军，随即北上；前218年在波河边建普拉森提亚、克雷莫纳两座殖民城，同年汉尼拔翻过阿尔卑斯山，这里的高卢人纷纷投他。</li>
  <li><b>波河两岸</b>：南岸叫“波河这边”（Cispadana），北岸叫“波河那边”（Transpadana）。前89年南岸拿到公民权，北岸只给拉丁权，也就是“绿卡”；北岸人争了四十年，前49年恺撒才给足公民权，北岸也成了他最可靠的兵源。卡图卢斯（维罗纳）、维吉尔（曼图亚）、李维（帕塔维乌姆）都生在北岸。</li>
  <li><b>卢比孔河（Rubicon）</b>：一条流进亚得里亚海的小河。按苏拉的法律，总督只能在自己的行省里带兵，带兵越界就是叛国。前49年1月，恺撒带第十三军团从拉文纳南下过河，说了句“骰子已经掷出去了”。古卢比孔究竟是今天哪条河，争了几百年；如今的鲁比科内河是1933年才定的名。</li>
  <li><b>恺撒的后院</b>：前59年起恺撒兼管山南高卢、伊利里库姆和山北高卢。冬天不打仗，他就回山南高卢办公、见罗马来的人；前56年三人续约的卢卡，就在这个行省的南端。</li>
  <li><b>并入意大利</b>：前43年元老院的军队在穆提那打败安东尼，同年秋三巨头在博诺尼亚附近会面；前42年山南高卢行省取消，意大利从此北抵阿尔卑斯山。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="italia">意大利的分野</a><a class="go" data-go="gallia">高卢</a><a class="go" data-go="history-rome-caesar">恺撒</a></p>`,

{ id:'africa', ch:5, title:'迦太基与阿非利加', short:'阿非利加', c:COL.africa,
  sub:'Carthago · Africa · 一个大洲因一个行省得名',
  view:[[32.8,-6.4],[38.2,11.8]],
  legend:[['dash','#7a3b1c','迦太基本土，约前264年'],['fill',COL.rome,'阿非利加行省（前146年）'],['dash',COL.rome,'新阿非利加（前46年恺撒并入）'],['fill','#c79a4b','努米底亚王国，约前112年'],['fill','#9b7a5a','毛里塔尼亚王国']],
  html:`<p class="lede">今天的突尼斯北部。迦太基城坐在伸进海里的半岛上，扼住西西里海峡，正是地中海东西两半的腰眼。罗马人把这块地叫“阿非利加”，后来整个大洲都跟着叫了这个名字。</p>
  <ul>
  <li><b>迦太基（Carthage）</b>：传说前814年由推罗人建立，腓尼基语叫“新城”（Qart-hadasht）。它靠海上贸易和北非的大庄园致富，控制过西西里西部、撒丁和西班牙南部。城里有个圆形军港，环港和港中小岛上的船坞能停两百多艘战舰。</li>
  <li><b>阿非利加行省</b>：前146年迦太基被毁，罗马把它最后那块地设为行省，首府乌提卡。最肥的是巴格拉达斯河（今迈杰尔达河）谷，后来是罗马的粮仓之一。迦太基城后来照恺撒的计划重建为殖民城，帝国时代又成了西部仅次于罗马的大城。</li>
  <li><b>努米底亚（Numidia）</b>：迦太基西边的柏柏尔人王国，以轻骑兵闻名。马西尼萨帮罗马打赢扎马之战；他的孙子朱古达贿赂罗马元老，离开罗马时说这是一座“待价而沽的城，只要找到买主，很快就会灭亡”。前46年恺撒在塔普苏斯打败小加图一派和努米底亚王朱巴，把东部并为“新阿非利加”。</li>
  <li><b>毛里塔尼亚（Mauretania）</b>：再往西，今摩洛哥北部和阿尔及利亚西部，同努米底亚以穆卢耶河为界，和今天的毛里塔尼亚国不是一回事。国王波库斯是朱古达的岳父，前105年却把他交给了苏拉。前25年奥古斯都让朱巴的儿子朱巴二世在这里当国王，王后是克娄巴特拉和安东尼的女儿。</li>
  <li><b>名字</b>：“阿非利加”起初只指这一个行省，来历说法不一，可能出自当地一个部族名。后来阿拉伯人把这一带叫“伊弗里基叶”，指的还是以突尼斯为中心的这块地方。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="history-rome-punic">布匿战争</a><a class="go" data-go="history-rome-marius">马略的兵</a><a class="go" data-go="hispania">希斯帕尼亚</a></p>`,
  show:['alboran','gibraltar','gulfGabes','balearic','tyrrhenian'], hide:['sicilyChannel'],

    d.region('gMauretania', '#9b7a5a', {weight:1.2, fillOpacity:.26});
    d.region('hNumidia', '#c79a4b', {weight:1.2, fillOpacity:.28});
    d.region('hAfrica146', COL.rome, {weight:1.6, fillOpacity:.32});

{ id:'hispania', ch:5, title:'希斯帕尼亚（西班牙）', short:'西班牙', c:COL.hispania,
  sub:'Hispania · 罗马打得最久的地方',
  view:[[35.6,-10.0],[44.2,4.0]],
  legend:[['dash','#7a3b1c','巴卡家族的西班牙，约前219年'],['fill',COL.hispania,'罗马已控制，约前133年'],['fill','#c9ad72','前133—前19年陆续征服']],
  html:`<p class="lede">伊比利亚半岛，罗马人叫它希斯帕尼亚（Hispania），今天的西班牙和葡萄牙。中间是高原，四周是山，几条大河从高原流向海边。罗马从前218年登陆，到前19年平定北方山区，整整打了两百年。</p>
  <ul>
  <li><b>迦太基的西班牙</b>：第一次布匿战争丢了西西里，汉尼拔的父亲哈米尔卡带着家人来西班牙，靠银矿另起一个帝国，以新迦太基（今卡塔赫纳）为都。罗马接手以后，据波利比乌斯说，这里的银矿有四万人干活，每天给罗马挣两万五千德拉克马。</li>
  <li><b>埃布罗河（Ebro）</b>：前226年罗马和迦太基以它为界。汉尼拔攻下河南的罗马盟友萨贡托，第二次布匿战争由此打响；前209年大西庇阿奇袭新迦太基，三年后把迦太基人赶出了西班牙。</li>
  <li><b>两个行省，打不完的仗</b>：前197年设近西班牙（东北）和远西班牙（南部）两省。高原上的凯尔特伊比利亚人、西边的卢西塔尼亚人一打就是几十年，前133年小西庇阿才攻下努曼提亚。在西班牙当兵是苦差，前151年、前138年保民官两次为征兵把执政官关进监狱：公民兵制度的裂缝，最早就是在这里露出来的。</li>
  <li><b>内战的第二战场</b>：马略派的塞多留在这里割据八年，在奥斯卡给当地贵族子弟办罗马式学校，庞培打得很吃力。恺撒在伊莱尔达、蒙达两次在这里打庞培派；蒙达之后他说，以前是为胜利而战，这一回是为性命而战。</li>
  <li><b>最后平定</b>：北部坎塔布里亚山区到前19年才被阿格里帕打下来，奥古斯都把西班牙分成三个行省。此后这里罗马化很深：图拉真、哈德良的家族都出自意大利卡城，哲学家塞涅卡生在科尔杜巴；西班牙语和葡萄牙语都是从拉丁语变来的。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="history-rome-punic">布匿战争</a><a class="go" data-go="history-rome-pompey">庞培与克拉苏</a><a class="go" data-go="africa">迦太基与阿非利加</a></p>`,

{ id:'gallia', ch:5, title:'高卢', short:'高卢', c:COL.gallia,
  sub:'Gallia · “高卢全境分为三部分”',
  view:[[42.2,-5.4],[51.6,9.6]],
  legend:[['fill',COL.rome,'行省（Provincia），前121年设'],['fill','#b8963a','阿基坦人'],['fill','#7a8f4a','凯尔特人（罗马人叫高卢人）'],['fill','#4f7da0','比利其人']],
  html:`<p class="lede">阿尔卑斯山那一边的高卢（Gallia Transalpina），大约是今天的法国、比利时，加上莱茵河以西的德国和瑞士西部。恺撒的《高卢战记》第一句就是：“高卢全境分为三部分。”</p>
  <ul>
  <li><b>行省（Provincia）</b>：地中海沿岸的一条，前121年设省，前118年建纳博殖民城，打通去西班牙的陆路。罗马人干脆叫它“行省”，这个词留在了地名里，就是今天的普罗旺斯。马西利亚（今马赛）是前600年前后希腊人建的城，罗马的老盟友。</li>
  <li><b>三部分</b>：行省以北是“长发高卢”（Gallia Comata），一个个自由的部落。恺撒说，加龙河以南是阿基坦人；塞纳河、马恩河以北是比利其人，“他们最勇敢”，因为离行省的奢侈品最远，又天天和莱茵河对岸的日耳曼人打仗；中间自称凯尔特人，罗马人叫他们高卢人。</li>
  <li><b>北方来的恐惧</b>：前113年起辛布里人、条顿人南下，前105年在阿劳西奥一天歼灭罗马两支大军。罗马让马略连任执政官，他在阿奎塞克斯提埃、韦尔切利两战全歼。对北方蛮族的恐惧，后来成了恺撒出兵的理由。</li>
  <li><b>恺撒征服</b>：前58—前50年，他以赫尔维提人迁徙、日耳曼人阿里奥维斯图斯入境为由出兵，八年打到莱茵河和大西洋。前52年维钦托利在比布拉克特被推为全高卢的统帅，在日尔戈维亚打退恺撒，最后在阿莱西亚投降。</li>
  <li><b>后来</b>：奥古斯都把长发高卢分成三个行省，名字基本照恺撒的三分；三省的中心卢格杜努姆（今里昂）是前43年建的。高卢人学说拉丁语，学成了今天的法语。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="history-rome-marius">马略的兵</a><a class="go" data-go="history-rome-triumvirate">前三头</a><a class="go" data-go="britannia">不列颠</a></p>`,

{ id:'britannia', ch:5, title:'不列颠', short:'不列颠', c:COL.britannia,
  sub:'Britannia · 大洋那边的岛',
  view:[[49.5,-9.6],[58.8,4.0]],
  legend:[['fill',COL.britannia,'罗马的不列颠行省：公元43年起，北到哈德良长城'],['fill','#cfd6c4','喀里多尼亚：始终没打下来'],['line','#2a2018','哈德良长城（122年起）'],['dline','#8a1c1c','恺撒渡海（前55、前54年）']],
  html:`<p class="lede">大西洋上的大岛，隔着最窄约33公里的海峡与高卢相望。罗马人觉得它在“大洋”（Oceanus）之外，是世界的边上。</p>
  <ul>
  <li><b>锡</b>：青铜要锡，不列颠西南角早就以产锡出名。前4世纪末，马西利亚的希腊人皮西亚斯绕岛航行，留下了最早的记录。</li>
  <li><b>恺撒两次登陆</b>：前55年、前54年两次渡海。第二回带了五个军团，过泰晤士河打败卡西维拉努斯，收了人质、定了贡赋就走，没有设省。他的理由是不列颠人一直在接济高卢；在罗马，这是“越过大洋”的壮举，第一次渡海之后元老院就宣布了二十天的感恩祭。</li>
  <li><b>真正征服</b>：近一百年后，公元43年克劳狄乌斯皇帝出兵设省，自己带着大象进了卡穆洛杜努姆。60年前后布狄卡女王起义，烧了伦迪尼乌姆。</li>
  <li><b>北界</b>：苏格兰高地（喀里多尼亚）始终没拿下，122年起哈德良修长城为界。爱尔兰（希伯尼亚）罗马人从没去打。</li>
  <li><b>后来</b>：410年前后罗马军队撤走。和高卢、西班牙不同，不列颠人后来不说拉丁语，英语是后来渡海来的盎格鲁—撒克逊人的语言。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="gallia">高卢</a><a class="go" data-go="empire">罗马帝国</a></p>`,

{ id:'provinces', ch:5, title:'罗马的行省（至前27年）', short:'行省', c:COL.provinces,
  sub:'Provinciae · 前241—前27年',
  view:[[27.2,-9.8],[51.8,41.5]],
  legend:[['fill',COL.rome,'意大利'],['fill','#c47a2b','前241—前197年：布匿战争所得'],['fill','#b8963a','前148—前101年：征服地中海'],['fill','#5f8a8b','前74—前30年：庞培、恺撒、屋大维']],
  html:`<p class="lede">“行省”（provincia）原意是派给某位官员的差事。罗马打下海外的地方，每年派一位司法官，或卸任的执政官、司法官去管，这块地就成了他的“差事”。到前27年，地中海四周几乎都成了罗马的行省，图上标的是设省年份。</p>
  <ul>
  <li><b>第一批</b>：西西里（前241）、撒丁和科西嘉（前238年夺取，前227年设省）、近西班牙和远西班牙（前197），都是从迦太基手里拿来的。</li>
  <li><b>征服地中海</b>：马其顿（前148）、阿非利加（前146）、亚细亚（前133，帕加马国王遗赠，提比略·格拉古就想拿它的国库给农民买农具）、山北高卢（前121）、奇里乞亚（前102年起，打海盗的据点）。希腊归马其顿总督兼管，前27年才单设阿凯亚行省。</li>
  <li><b>最后一波</b>：昔兰尼（前96年遗赠，前74年设省）、比提尼亚（前74年遗赠）、克里特（前67）、本都（前63年并入比提尼亚）、叙利亚（前64）、塞浦路斯（前58年，克洛狄乌斯派小加图去接收）、长发高卢（前58—前50年征服）、新阿非利加（前46）、埃及（前30）。行省外面还有一圈附庸王国，如加拉太、卡帕多西亚、犹太、色雷斯，名义独立，实际听罗马的。</li>
  <li><b>怎么管</b>：总督任期通常一年，带兵、审案，税包给骑士阶层的包税公司去收。当一任总督，足以还清竞选欠下的债：西塞罗控告的维雷斯在西西里三年，据说捞了四千万塞斯特斯。罗马政坛的选票和贿金，很大一部分是从行省来的。</li>
  <li><b>前27年</b>：奥古斯都和元老院分行省。边疆要驻兵的归他，派自己的副将去管；内地太平的归元老院，照旧抽签派总督。兵在谁手里，一目了然。</li>
  </ul>
  <p class="see">相关：<a class="go" data-go="history-rome-gracchi">格拉古兄弟</a><a class="go" data-go="history-rome-augustus">后三头与奥古斯都</a><a class="go" data-go="empire">罗马帝国（117年）</a></p>`,

{ id:'empire', ch:5, title:'罗马帝国', short:'罗马帝国', c:COL.empire,
  sub:'Imperium Romanum · 公元 117 年',
  view:[[21.5,-11],[56.5,50]],
  legend:[['fill',COL.empire,'罗马帝国，117 年（图拉真去世时）'],['fill','#d4807a','图拉真东扩（114–117，旋即放弃）'],['dline','#2a2018','395 年东西分界'],['dash',COL.persia,'对照：阿契美尼德波斯，约前 500 年']],
  html:`<p class="lede">以地中海为内湖的帝国——罗马人干脆管它叫<b>“我们的海”</b>（Mare Nostrum）。117 年图拉真去世时版图最大，约 500 万平方公里。</p>
  <ul>
  <li><b>边界靠自然屏障</b>：北是莱茵河—多瑙河，南是撒哈拉，东是幼发拉底河与叙利亚沙漠，西是大西洋，西北到不列颠（几年后修了哈德良长城）。多瑙河北岸的达契亚（今罗马尼亚）是图拉真 106 年新征服的。</li>
  <li><b>短暂的东扩</b>：114–117 年图拉真越过幼发拉底河，设亚美尼亚、美索不达米亚等行省，一度打到波斯湾；他一死，继任的哈德良就放弃了（图中浅色部分）。</li>
  <li><b>分裂</b>：395 年狄奥多西一世死后，帝国永久分为东西两半（图中黑色虚线）。西罗马 476 年灭亡；东罗马以君士坦丁堡为都，一直延续到 1453 年。他们始终自称“罗马人”，“拜占庭帝国”是 16 世纪西欧学者起的名字。</li>
  <li><b>和波斯比一比</b>：两者面积相当（蓝色虚线是阿契美尼德波斯）。波斯是陆上帝国，靠御道把高原和河谷串起来；罗马是环海帝国，地中海就是它的高速公路——把粮食从地中海一头运到另一头，比用车走一百多公里陆路还便宜。</li>
  </ul>
  <p class="see">回看：<a class="go" data-go="persia">波斯</a><a class="go" data-go="alexander">亚历山大东征</a><a class="go" data-go="overview">总览</a></p>

/* ============================================================
   Map setup
   ============================================================ */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const map = L.map('map', {zoomControl:false, minZoom:1, maxZoom:10, zoomSnap:0.25, zoomDelta:0.5, wheelPxPerZoomLevel:90, worldCopyJump:false});
L.control.zoom({position:'topleft'}).addTo(map);
L.control.scale({position:'bottomright', imperial:false, maxWidth:140}).addTo(map);
map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
map.createPane('fallbackPane').style.zIndex = 190;
L.geoJSON(GEO.land, {pane:'fallbackPane', style:{fillColor:'#eee4c9',fillOpacity:1,color:'#8b9b97',weight:.7}, interactive:false}).addTo(map);
const tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom:8, maxZoom:10, attribution:'底图 © Esri, US National Park Service · 水系与国界 Natural Earth · 古代疆界均为示意'
}).addTo(map);
tiles.on('tileerror', () => { document.getElementById('mapnote').hidden = false; });
// Physical Map stops at z8; use a label-free, higher-resolution terrain for close-ups.
const closeTerrain=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',{
  minZoom:9,maxNativeZoom:13,maxZoom:10
}).addTo(map);
closeTerrain.on('tileerror',()=>{document.getElementById('mapnote').hidden=false;});
[['regionPane',410],['riverPane',420],['linePane',430],['baseLabelPane',450],['labelPane',620]].forEach(([n,z]) => { map.createPane(n).style.zIndex = z; });
map.getPane('baseLabelPane').style.pointerEvents = 'none';

const container = map.getContainer();
function zoomClasses(){
  const z = map.getZoom();
  for (let i=3;i<=8;i++) container.classList.toggle('z'+i, z >= i - 0.01);
}
map.on('zoomend', zoomClasses);

/* base rivers (always on, thin) */
const BASE_RIVERS = ['nile','bluenile','atbara','euphrates','tigris','shatt','danube','po','tiber','rhine','indus','jhelum','chenab','ravi','beas','sutlej','oxus','jaxartes','halys','jordan','strymon','hebrus','sava','haliacmon','maeander','karkheh','zeravshan','helmand','rhone','ebro','sakarya','arno','nestos','aras','kupa','drina'];
const riverStyle = {pane:'riverPane', color:'#3f77a8', weight:1.1, opacity:.6, interactive:false};
BASE_RIVERS.forEach(k => { if (GEO.rivers[k]) L.geoJSON(GEO.rivers[k].geom, {style:riverStyle, interactive:false}).addTo(map); });

function divLabel(o, pane){
  const cls = ['lb', ...o.cls.split(' ')];
  if (o.z) cls.push('mz'+o.z);
  if (o.v) cls.push('v');
  if (o.force) cls.push('force');
  const rot = o.rot ? ` rotate(${o.rot}deg)` : '';
  const sub = o.sub ? `<small>${o.sub}</small>` : '';
  const style = `transform:translate(-50%,-50%)${rot};${o.c?`--c:${o.c};`:''}`;
  const en = o.en || (o.go && META[o.go]?.en) || englishLabel(o.t);
  const english = en ? `<span class="lb-en">${en}</span>` : '';
  const html = `<div class="${cls.join(' ')}" style="${style}">${o.t}${english}${sub}</div>`;
  return L.marker(o.ll, {pane, interactive:!!o.go, keyboard:!!o.go, title:o.go?o.t+(en?' · '+en:''):'',
    icon:L.divIcon({className:'', html, iconSize:[0,0]})});
}

const baseMarkers = {};
Object.entries(BASE).forEach(([id,[la,lo,t,cls,z,rot,v,en]]) => {
  const goId=BASE_LINKS[id];
  cls+=(MARITIME_SEA_IDS.has(id)?' maritime':'')+(goId?' click':'');
  const m=divLabel({t,en,ll:[la,lo],cls,z,rot,v,go:goId},'baseLabelPane').addTo(map);
  if(goId)m.on('click',()=>go(goId));
  baseMarkers[id]=m;
});

});

tMarine.onclick=()=>{
  const on=tMarine.getAttribute('aria-pressed')!=='true';
  container.classList.toggle('maritime-off',!on);

};
const riverMarkers = GEO.riverLabels.map(r => ({

/* modern borders (toggle) */
const modern = L.layerGroup([
  L.geoJSON(GEO.borders, {style:{pane:'linePane', color:'#4a4a4a', weight:1.1, opacity:.75, dashArray:'4 3'}, interactive:false}),
  ...GEO.countryLabels.map(c => divLabel({t:c.t, en:c.en, ll:c.ll, cls:'country', z:c.r<=3?3:(c.r<=5?5:6)}, 'baseLabelPane'))
]);
const tModern = document.getElementById('tModern');
tModern.onclick = () => {
  const on = !map.hasLayer(modern);
  on ? modern.addTo(map) : map.removeLayer(modern);
  tModern.classList.toggle('on', on);
  tModern.setAttribute('aria-pressed', String(on));
};

/* ============================================================
   Drawing context per entry
   ============================================================ */
let group = L.featureGroup().addTo(map);
let pinIndex = {};
let forced = [];

function makeCtx(entry){
  return {
    region(key, color, st){
      const g = GEO.regions[key]; if (!g) return;
      const style = Object.assign({pane:'regionPane', color, fillColor:color, weight:1.5, opacity:.9, fillOpacity:.22, className:'reg', interactive:false}, st||{});
      if (st && st.color) style.color = st.color;
      return L.geoJSON(g, {style, interactive:false}).addTo(group);
    },
    river(key, st){
      const r = GEO.rivers[key]; if (!r) return;
      L.geoJSON(r.geom, {style:Object.assign({pane:'riverPane', className:'reg', interactive:false}, st), interactive:false}).addTo(group);
    },
    line(coords, st){
      L.polyline(coords, Object.assign({pane:'linePane', className:'reg', interactive:false, lineJoin:'round'}, st)).addTo(group);
    },
    route(coords, st){
      const pl = L.polyline(coords, Object.assign({pane:'linePane', className:'route', interactive:false, lineJoin:'round'}, st)).addTo(group);
      const path = pl.getElement();
      if (!reduceMotion && path && path.getTotalLength){
        const len = path.getTotalLength();
        path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
        path.getBoundingClientRect();
        requestAnimationFrame(() => { path.style.strokeDashoffset = 0; });
        const done = () => { path.style.strokeDasharray = ''; path.style.strokeDashoffset = ''; path.style.transition = 'none'; };
        path.addEventListener('transitionend', done, {once:true});
        map.once('zoomstart', done);
      }
    },
    pin(p){
      const k = ['pin', 'k-'+p.kind]; if (p.left) k.push('left'); if (p.battle) k.push('b');
      const iattr = p.icon ? (p.kind==='num' ? ` data-n="${p.icon}"` : '') : '';
      const inner = p.kind==='cat' ? p.icon : '';
      const en = p.en || englishLabel(p.n);
      const english = en ? `<small class="pin-en mz7">${en}</small>` : '';
      const html = `<div class="${k.join(' ')}"><i${iattr}>${inner}</i>${p.n?`<span${p.labelZ?` class="mz${p.labelZ}"`:''}>${p.n}${english}</span>`:''}</div>`;
      const m = L.marker(p.ll, {pane:'labelPane', title:p.n+(en?' · '+en:'')||'第'+p.icon+'瀑布', icon:L.divIcon({className:'', html, iconSize:[0,0]}), keyboard:true}).addTo(group);
      if (p.go){ m.on('click', () => go(p.go)); }
      else if (p.note || p.n){
        m.bindPopup(`<b>${p.n||''}</b>${en?`<span class="popup-en">${en}</span>`:''}${p.note||''}`, {className:'parch', closeButton:false, offset:[0,-6], autoPanPadding:[40,40]});
      }
      if (p.key) pinIndex[p.key] = m;
      return m;
    },
    label(o){
      const m = divLabel(o, 'labelPane').addTo(group);
      if (o.go) m.on('click', () => go(o.go));
    }
  };
}
