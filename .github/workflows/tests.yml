# The full test set, away from the shared machine the agents work on.
# Once this job is selected in Vercel's Deployment Checks, a production deployment waits for it to pass.
name: Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push replaces the run in progress: only the latest commit can go live anyway.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  full-set:
    # macOS, because the page asks for PingFang first: text that wraps differently would fail the layout checks.
    # Chrome is preinstalled, at the path the suites use.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CHECK: 'Vercel - history-of-europe-in-frames: full-set'
    steps:
      # Vercel's Deployment Checks read commit statuses. Its own action for this reports a cancelled or timed-out run
      # as success, which would let untested work go live, so these two steps report the job's real outcome.
      - name: Report that the tests are running
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="$CHECK" --silent
      - uses: actions/checkout@v7
      - run: npm ci
      - name: The committed page is what Vercel will build
        run: npm run build && git diff --exit-code --stat index.html
      # 2 at once: this machine has 7 GB. The trial run took under 4 minutes.
      - name: All suites
        run: python3 tests/run_tests.py --jobs 2
      - name: Report the result
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in success) state=success ;; failure) state=failure ;; *) state=error ;; esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="$CHECK" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
